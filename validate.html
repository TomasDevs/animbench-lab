<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>animbench-lab equivalence check</title>
    <script>
      // Set before first paint, so the page never flashes the wrong theme.
      var params = new URLSearchParams(location.search)
      document.documentElement.dataset.theme = params.get('theme') === 'light' ? 'light' : 'dark'
      document.documentElement.lang = params.get('lang') === 'cs' ? 'cs' : 'en'
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!-- Off screen, outside #app: re-rendering the page must never touch a running scene. -->
    <div id="stage"></div>
    <script type="module" src="/src/validate/main.ts"></script>
  </body>
</html>
